<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151d">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Live Translator</title>
<style>
  :root{
    --ink:#1c2230; --paper:#eef1f6; --panel:#ffffff;
    --accent:#2456d6; --accent-soft:#dbe5fb;
    --live:#d6244e; --ok:#1a8a5c; --line:#c7cedd; --muted:#5a6172;
    --reply-bg:#fafbfe;
    --err-bg:#fdecef; --err-line:#f3b8c6; --err-ink:#8f1735;
  }
  body.dark{
    --ink:#e8ebf4; --paper:#12151d; --panel:#1c2130;
    --accent:#6f96ff; --accent-soft:#26304a;
    --live:#ff5c82; --ok:#4cd396; --line:#333b52; --muted:#9aa2b8;
    --reply-bg:#171c29;
    --err-bg:#3a1620; --err-line:#6d2436; --err-ink:#ffb3c2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Heebo","Hiragino Sans",Arial,sans-serif;background:var(--paper);color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px;transition:background .2s,color .2s}
  .app{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
  header{display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:1.25rem;font-weight:800}
  header h1 small{font-size:.65rem;color:var(--muted);font-weight:600}
  header .right{display:flex;gap:8px;align-items:center}
  .status{font-size:.82rem;color:var(--muted)}
  .status.live{color:var(--live);font-weight:700}
  .theme{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;width:36px;height:36px;font-size:1rem;cursor:pointer}

  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
  .label{font-size:.78rem;color:var(--muted);font-weight:700}
  .text{font-size:1.15rem;line-height:1.45;word-break:break-word}
  .text.placeholder{color:var(--muted);opacity:.7}
  .romaji{font-size:.95rem;color:var(--muted);font-style:italic;direction:ltr;text-align:left}

  /* history scrolls INSIDE its own frame */
  #histBox{max-height:38vh}
  #histList{overflow-y:auto;flex:1;min-height:0;padding-inline-end:4px}
  .turn{border-inline-start:3px solid var(--line);padding:6px 10px;margin-bottom:8px}
  .turn.a{border-color:var(--accent)}
  .turn.b{border-color:#7a3fd4}
  .turn .src{font-size:.9rem;color:var(--muted)}
  .turn .dst{font-size:1.08rem;font-weight:600}
  .turn .ro{font-size:.88rem;color:var(--muted);font-style:italic}

  #outBox{border-color:var(--accent);border-width:2px}
  #outBox .label{color:var(--accent)}
  #inBox{max-height:16vh}
  #inText{overflow-y:auto}

  .pair{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;align-items:center;gap:8px;justify-content:center}
  select{font-size:1rem;font-weight:700;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
  .swap{border:none;background:var(--accent-soft);color:var(--accent);width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer}

  .controls{display:flex;gap:8px;align-items:stretch;justify-content:center;flex-wrap:wrap}
  .mic{flex:1;max-width:220px;min-width:140px;height:68px;border-radius:18px;border:none;cursor:pointer;background:var(--accent);color:#fff;
    box-shadow:0 5px 14px rgba(36,86,214,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .mic .micIcon{font-size:1.3rem}
  .mic .micLbl{font-size:.82rem;font-weight:800}
  .mic-b{background:#7a3fd4;box-shadow:0 5px 14px rgba(122,63,212,.35)}
  .mic.listening{background:var(--live);animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,36,78,.45)}70%{box-shadow:0 0 0 18px rgba(214,36,78,0)}100%{box-shadow:0 0 0 0 rgba(214,36,78,0)}}
  .side{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--ink)}
  .side.on{border-color:var(--ok);color:var(--ok)}

  #repliesBox{border-color:var(--ok);border-width:2px}
  #repliesBox .label{color:var(--ok)}
  .reply{border:1px solid var(--ok);border-radius:10px;padding:9px 11px;margin-top:8px;cursor:pointer;background:var(--reply-bg)}
  .reply:hover{border-color:var(--accent)}
  .reply .ja{font-size:1.05rem;font-weight:700}
  .reply .ro{font-size:.9rem;color:var(--muted);font-style:italic}
  .reply .mean{font-size:.9rem;color:var(--ok)}

  .hint{text-align:center;font-size:.8rem;color:var(--muted)}
  .err{display:none;background:var(--err-bg);border:1px solid var(--err-line);color:var(--err-ink);border-radius:12px;padding:10px 12px;font-size:.88rem}
  .err.show{display:block}

  .popup-wrap{position:fixed;top:10px;left:10px;right:10px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .popup{pointer-events:auto;border-radius:12px;padding:11px 13px;font-size:.9rem;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.45);
    display:flex;gap:10px;align-items:flex-start;animation:pin .2s}
  @keyframes pin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
  .popup .tag{font-weight:800;font-size:.72rem;padding:2px 8px;border-radius:8px;white-space:nowrap}
  .popup.app{background:#3a1620;border:1px solid #6d2436;color:#ffb3c2}
  .popup.app .tag{background:#6d2436;color:#fff}
  .popup.api{background:#3a2a10;border:1px solid #6d5324;color:#ffd9a0}
  .popup.api .tag{background:#6d5324;color:#fff}
  .popup.net{background:#10283a;border:1px solid #24506d;color:#a0d4ff}
  .popup.net .tag{background:#24506d;color:#fff}
  .popup .x{margin-inline-start:auto;background:none;border:none;color:inherit;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<div class="popup-wrap" id="popups"></div>
<div class="app">
  <header>
    <h1>Live Translator <small>v13</small></h1>
    <div class="right">
      <button class="theme" id="themeBtn">🌙</button>
      <div class="status" id="status">Ready</div>
    </div>
  </header>

  <!-- RESULTS ON TOP -->
  <div class="box" id="histBox" style="display:none">
    <div class="label">Conversation (newest first)</div>
    <div id="histList"></div>
  </div>

  <div class="box" id="repliesBox" style="display:none">
    <div class="label">💬 Suggested replies — tap to hear in Japanese</div>
    <div id="repliesList"></div>
  </div>

  <div class="box" id="outBox">
    <div class="label">Translation</div>
    <div class="text placeholder" id="outText">…</div>
    <div class="romaji" id="outRomaji"></div>
  </div>

  <div class="box" id="inBox">
    <div class="label">Heard</div>
    <div class="text placeholder" id="inText">Tap a mic and speak…</div>
  </div>

  <!-- CONTROLS BELOW -->
  <div class="pair">
    <select id="srcLang">
      <option value="en" selected>English</option>
      <option value="ja">日本語 Japanese</option>
      <option value="he">עברית Hebrew</option>
    </select>
    <button class="swap" id="swapBtn">⇄</button>
    <select id="dstLang">
      <option value="en">English</option>
      <option value="ja" selected>日本語 Japanese</option>
      <option value="he">עברית Hebrew</option>
    </select>
  </div>

  <div class="controls">
    <button class="mic" id="micBtn"><span class="micIcon">🎤</span><span class="micLbl" id="micLblA">EN → JA</span></button>
    <button class="mic mic-b" id="micBtnB"><span class="micIcon">🎤</span><span class="micLbl" id="micLblB">JA → EN</span></button>
  </div>
  <div class="controls">
    <button class="side" id="simulBtn">⚡ Simultaneous: OFF</button>
    <button class="side" id="convoBtn">🗣 Conversation: OFF</button>
    <button class="side" id="autoSpeak">🔊 Auto-speak: ON</button>
    <button class="side" id="camBtn">📷 Camera</button>
  </div>

  <div class="box" id="camBox" style="display:none">
    <div class="label">Camera translate — point at Japanese text</div>
    <video id="camVideo" autoplay playsinline muted style="width:100%;border-radius:10px;background:#000"></video>
    <div class="text" id="camOut" style="min-height:2em"></div>
    <div class="romaji" id="camRomaji"></div>
    <div class="controls" style="margin-top:6px"><button class="side" id="camStop">✖ Stop camera</button></div>
  </div>

  <div class="err" id="err"></div>

  <details class="box" style="min-height:0">
    <summary class="label" style="cursor:pointer">⚙️ Settings — OpenAI API key</summary>
    <input type="password" id="oaiKey" placeholder="OpenAI API key: sk-..." style="margin-top:8px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-size:.95rem;width:100%">
    <div class="hint" style="text-align:start;margin-top:6px">Stored on this device only.</div>
  </details>

  <div class="hint">Works best in Chrome / Android Chrome.</div>
</div>

<script>
const LANG={en:{name:"English",bcp:"en-US",label:"English"},ja:{name:"Japanese",bcp:"ja-JP",label:"日本語"},he:{name:"Hebrew",bcp:"he-IL",label:"עברית"}};
const $=id=>document.getElementById(id);
const srcSel=$("srcLang"),dstSel=$("dstLang"),micBtn=$("micBtn"),micBtnB=$("micBtnB"),
      inText=$("inText"),outText=$("outText"),outRomaji=$("outRomaji"),statusEl=$("status"),errEl=$("err"),
      autoSpeakBtn=$("autoSpeak"),convoBtn=$("convoBtn"),simulBtn=$("simulBtn"),
      histBox=$("histBox"),histList=$("histList"),repliesBox=$("repliesBox"),repliesList=$("repliesList");

let listening=false,autoSpeak=true,rec=null;
let convoMode=false,turnTimer=null;
let activeSrc="en",activeDst="ja",activeBtn=null;
let translatedSoFar="",pendingQueue=[],translating=false,sessionSourceText="",extrasTimer=null;
let translationFailed=false,displayDirty=false,lastTurnEl=null,listeningStoppedManually=false;

/* ---------- errors ---------- */
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function classifyError(msg){
  const m=String(msg).toLowerCase();
  if(m.includes("api 401")||m.includes("invalid_api_key")||m.includes("incorrect api key"))return{kind:"api",tag:"OPENAI",text:"Invalid API key. Check ⚙️ Settings."};
  if(m.includes("api 429")||m.includes("insufficient_quota")||m.includes("quota"))return{kind:"api",tag:"OPENAI",text:"Out of credit or rate-limited. Check billing at platform.openai.com."};
  if(m.includes("api 50")||m.includes("api 52")||m.includes("api 53"))return{kind:"api",tag:"OPENAI",text:"OpenAI servers are struggling — retry in a minute."};
  if(m.includes("api "))return{kind:"api",tag:"OPENAI",text:"OpenAI error: "+msg};
  if(m.includes("failed to fetch")||m.includes("networkerror")||m.includes("load failed"))return{kind:"net",tag:"NETWORK",text:"No connection — check internet."};
  if(m.includes("mic permission")||m.includes("not-allowed"))return{kind:"app",tag:"DEVICE",text:"Microphone blocked — allow mic for this site in Chrome."};
  if(m.includes("camera"))return{kind:"app",tag:"DEVICE",text:msg};
  if(m.includes("speech recognition network"))return{kind:"app",tag:"BROWSER",text:"Chrome speech service unreachable — use real Google Chrome online."};
  return{kind:"app",tag:"APP BUG",text:msg+" — screenshot this and send it to Claude."};
}
function popup(kind,tag,text){
  const w=$("popups"),d=document.createElement("div");
  d.className="popup "+kind;
  d.innerHTML='<span class="tag">'+tag+'</span><span>'+escapeHtml(text)+'</span><button class="x">✕</button>';
  d.querySelector(".x").onclick=()=>d.remove();
  w.appendChild(d);while(w.children.length>3)w.firstChild.remove();
  setTimeout(()=>{if(d.parentNode)d.remove();},12000);
}
function showErr(msg){const c=classifyError(msg);popup(c.kind,c.tag,c.text);errEl.textContent=c.text;errEl.classList.add("show");}
function clearErr(){errEl.classList.remove("show");}
window.addEventListener("error",e=>popup("app","APP BUG",(e.message||"Unknown script error")+" — screenshot this and send it to Claude."));
window.addEventListener("unhandledrejection",e=>{showErr((e.reason&&e.reason.message)||String(e.reason||"Unknown error"));});

function setStatus(t,live){statusEl.textContent=t;statusEl.classList.toggle("live",!!live);}

/* ---------- theme ---------- */
const themeBtn=$("themeBtn");
function applyTheme(dark){document.body.classList.toggle("dark",dark);themeBtn.textContent=dark?"☀️":"🌙";}
let darkPref=matchMedia("(prefers-color-scheme: dark)").matches;applyTheme(darkPref);
themeBtn.onclick=()=>{darkPref=!darkPref;applyTheme(darkPref);};

/* ---------- key ---------- */
const savedOai=localStorage.getItem("lt_oai_key");if(savedOai)$("oaiKey").value=savedOai;
$("oaiKey").addEventListener("change",()=>localStorage.setItem("lt_oai_key",$("oaiKey").value.trim()));
function keyCheck(){
  if(!$("oaiKey").value.trim()){showErr("No API key set. Open ⚙️ Settings and paste your OpenAI key.");return false;}
  return true;
}

/* ---------- OpenAI helpers ---------- */
async function aiChat(userContent,maxTokens){
  const r=await fetch("https://api.openai.com/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+$("oaiKey").value.trim()},
    body:JSON.stringify({model:"gpt-4o-mini",max_tokens:maxTokens||800,messages:[{role:"user",content:userContent}]})
  });
  if(!r.ok){const t=await r.text().catch(()=>"");throw new Error("API "+r.status+(t?": "+t.slice(0,160):""));}
  const d=await r.json();
  return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim();
}

/* ---------- pair selectors ---------- */
function ensureDifferent(changed){
  if(srcSel.value===dstSel.value){
    const other=["en","ja","he"].find(l=>l!==srcSel.value);
    (changed==="src"?dstSel:srcSel).value=other;
  }
}
srcSel.onchange=()=>{ensureDifferent("src");refreshMicLabels();};
dstSel.onchange=()=>{ensureDifferent("dst");refreshMicLabels();};
$("swapBtn").onclick=()=>{const a=srcSel.value;srcSel.value=dstSel.value;dstSel.value=a;refreshMicLabels();};
function refreshMicLabels(){
  $("micLblA").textContent=LANG[srcSel.value].label+" → "+LANG[dstSel.value].label;
  $("micLblB").textContent=LANG[dstSel.value].label+" → "+LANG[srcSel.value].label;
}
refreshMicLabels();

autoSpeakBtn.classList.add("on");
autoSpeakBtn.onclick=()=>{autoSpeak=!autoSpeak;autoSpeakBtn.textContent="🔊 Auto-speak: "+(autoSpeak?"ON":"OFF");autoSpeakBtn.classList.toggle("on",autoSpeak);};

/* ---------- history ---------- */
function pushTurn(cls,srcText,dstText,ro){
  histBox.style.display="";
  const d=document.createElement("div");
  d.className="turn "+cls;
  d.innerHTML='<div class="src">'+escapeHtml(srcText)+'</div><div class="dst">'+escapeHtml(dstText)+'</div><div class="ro">'+escapeHtml(ro||"")+'</div>';
  histList.prepend(d);          // newest first
  histList.scrollTop=0;         // scroll INSIDE the box
  return d;
}
function pushTurnToHistory(){
  if(!sessionSourceText||!translatedSoFar)return;
  lastTurnEl=pushTurn(activeBtn===micBtnB?"b":"a",sessionSourceText,translatedSoFar,"");
}

/* ---------- speech recognition (mic buttons + conversation) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){showErr("Speech recognition not supported — use Chrome.");micBtn.disabled=true;micBtnB.disabled=true;}

function resetSession(){translationFailed=false;translatedSoFar="";pendingQueue=[];sessionSourceText="";displayDirty=true;}
function clearDisplayIfDirty(){
  if(!displayDirty)return;displayDirty=false;
  outText.textContent="…";outText.classList.add("placeholder");
  outRomaji.textContent="";repliesBox.style.display="none";repliesList.innerHTML="";
  inText.textContent="";
}

function startListening(){
  clearErr();
  if(!keyCheck()){stopUI();convoMode=false;convoBtn.textContent="🗣 Conversation: OFF";convoBtn.classList.remove("on");return;}
  resetSession();
  rec=new SR();
  rec.lang=LANG[activeSrc].bcp;
  rec.interimResults=true;
  rec.continuous=true;
  let enqueuedLen=0;

  function mergeOverlap(a,b){
    a=a.trim();b=b.trim();
    if(!a)return b;if(!b)return a;
    const al=a.toLowerCase(),bl=b.toLowerCase();
    if(al.endsWith(bl))return a;
    for(let k=Math.min(al.length,bl.length);k>0;k--)if(al.slice(-k)===bl.slice(0,k))return a+" "+b.slice(k).trim();
    return a+" "+b;
  }

  rec.onresult=e=>{
    let finals="",interim="";
    for(let i=0;i<e.results.length;i++){
      const t=e.results[i][0].transcript.trim();
      if(!t)continue;
      if(e.results[i].isFinal)finals=mergeOverlap(finals,t);else interim=mergeOverlap(interim,t);
    }
    sessionSourceText=finals;
    if(finals||interim)clearDisplayIfDirty();
    if(finals.length>enqueuedLen){
      const np=finals.slice(enqueuedLen).trim();enqueuedLen=finals.length;
      if(np)enqueueChunk(np);
      if(convoMode){if(turnTimer)clearTimeout(turnTimer);turnTimer=setTimeout(()=>{try{rec.stop();}catch(x){}},1500);}
    }
    inText.classList.remove("placeholder");
    inText.textContent=interim?mergeOverlap(finals,interim):finals;
    inText.dir=activeSrc==="he"?"rtl":"ltr";
  };
  rec.onerror=e=>{
    if(e.error==="no-speech")setStatus("No speech detected");
    else if(e.error==="not-allowed")showErr("Mic permission denied.");
    else if(e.error==="network")showErr("Speech recognition network error");
    else if(e.error!=="aborted")showErr("Recognition error: "+e.error);
  };
  rec.onend=async()=>{
    if(convoMode&&listening&&!listeningStoppedManually){
      stopUI();
      while(translating||pendingQueue.length){await new Promise(r=>setTimeout(r,120));}
      if(!sessionSourceText){startListening();return;}
      if(translationFailed||!translatedSoFar){
        convoMode=false;convoBtn.textContent="🗣 Conversation: OFF";convoBtn.classList.remove("on");stopUI();return;
      }
      pushTurnToHistory();
      fetchExtras();
      await waitForSpeech();
      [activeSrc,activeDst]=[activeDst,activeSrc];
      activeBtn=(activeBtn===micBtn)?micBtnB:micBtn;
      startListening();return;
    }
    if(listening&&!listeningStoppedManually){try{rec.start();}catch(x){}return;}
    stopUI();
  };
  rec.start();
  startUI();
}

function startUI(){listening=true;listeningStoppedManually=false;if(activeBtn)activeBtn.classList.add("listening");setStatus("Listening ("+LANG[activeSrc].label+")…",true);}
function stopUI(){listening=false;micBtn.classList.remove("listening");micBtnB.classList.remove("listening");setStatus("Ready");}

function toggleMic(btn,src,dst){
  if(listening){
    const same=activeBtn===btn;
    listeningStoppedManually=true;try{rec&&rec.stop();}catch(e){}stopUI();fetchExtras();
    setTimeout(pushTurnToHistory,400);
    if(same)return;
  }
  activeBtn=btn;activeSrc=src;activeDst=dst;
  startListening();
}
micBtn.onclick=()=>toggleMic(micBtn,srcSel.value,dstSel.value);
micBtnB.onclick=()=>toggleMic(micBtnB,dstSel.value,srcSel.value);

convoBtn.onclick=()=>{
  convoMode=!convoMode;
  convoBtn.textContent="🗣 Conversation: "+(convoMode?"ON":"OFF");
  convoBtn.classList.toggle("on",convoMode);
  if(convoMode&&!listening){activeBtn=micBtn;activeSrc=srcSel.value;activeDst=dstSel.value;startListening();}
  if(!convoMode&&listening){listeningStoppedManually=true;try{rec&&rec.stop();}catch(e){}stopUI();}
};

function waitForSpeech(){
  return new Promise(res=>{
    if(!window.speechSynthesis||!speechSynthesis.speaking){res();return;}
    const iv=setInterval(()=>{if(!speechSynthesis.speaking){clearInterval(iv);res();}},120);
    setTimeout(()=>{clearInterval(iv);res();},15000);
  });
}

/* ---------- chunked translation ---------- */
function enqueueChunk(chunk){
  pendingQueue.push(chunk);
  processQueue();
  if(extrasTimer)clearTimeout(extrasTimer);
  extrasTimer=setTimeout(fetchExtras,1800);
}
async function processQueue(){
  if(translating)return;translating=true;
  while(pendingQueue.length){await translateChunk(pendingQueue.splice(0).join(" "));}
  translating=false;
}
async function translateChunk(text){
  setStatus("Translating…",true);
  const src=LANG[activeSrc].name,dst=LANG[activeDst].name;
  try{
    const out=await aiChat(
"Translate this "+src+" speech segment into "+dst+". "+
(translatedSoFar?("Earlier context (do not repeat): "+translatedSoFar+"\n"):"")+
"IMPORTANT: your entire reply must be written in "+dst+" only. No romaji, no explanations, no quotes.\nSegment: "+text,600);
    if(!out)throw new Error("empty response");
    translatedSoFar+=(translatedSoFar?" ":"")+out;
    outText.classList.remove("placeholder");
    outText.textContent=translatedSoFar;
    outText.dir=activeDst==="he"?"rtl":"ltr";
    setStatus(listening?"Listening ("+LANG[activeSrc].label+")…":"Done",listening);
    if(autoSpeak)speak(out,activeDst);
  }catch(e){showErr("Translation failed — "+(e.message||"connection error"));setStatus("Ready");translationFailed=true;}
}

/* ---------- romaji + suggested replies ---------- */
async function fetchExtras(){
  const jaInvolved=activeSrc==="ja"||activeDst==="ja";
  if(!jaInvolved||!sessionSourceText)return;
  const userLang=activeSrc==="ja"?LANG[activeDst].name:LANG[activeSrc].name;
  const jaText=activeDst==="ja"?translatedSoFar:sessionSourceText;
  if(!jaText)return;
  try{
    let raw=await aiChat(
"Japanese text from a live conversation:\n\n"+jaText+"\n\nRespond ONLY with valid JSON, no markdown fences:\n"+
'{"romaji":"romaji of the Japanese text","replies":[{"ja":"short natural Japanese reply","romaji":"its romaji","meaning":"its meaning in '+userLang+'"},{"ja":"...","romaji":"...","meaning":"..."},{"ja":"...","romaji":"...","meaning":"..."}]}',1000);
    raw=raw.replace(/```json|```/g,"").trim();
    const obj=JSON.parse(raw);
    if(obj.romaji){
      outRomaji.textContent=obj.romaji;
      if(lastTurnEl){const ro=lastTurnEl.querySelector(".ro");if(ro&&!ro.textContent)ro.textContent=obj.romaji;}
    }
    if(Array.isArray(obj.replies)&&obj.replies.length){
      repliesBox.style.display="";repliesList.innerHTML="";
      const dir=userLang==="Hebrew"?"rtl":"ltr";
      for(const rep of obj.replies){
        const d=document.createElement("div");
        d.className="reply";
        d.innerHTML='<div class="ja">'+escapeHtml(rep.ja||"")+'</div><div class="ro">'+escapeHtml(rep.romaji||"")+'</div><div class="mean" dir="'+dir+'">'+escapeHtml(rep.meaning||"")+'</div>';
        d.onclick=()=>speak(rep.ja,"ja");
        repliesList.appendChild(d);
      }
    }
  }catch(e){/* extras are best-effort */}
}

/* ---------- TTS ---------- */
function speak(text,lang){
  if(!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang=LANG[lang].bcp;
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>v.lang.startsWith(lang))||vs.find(v=>v.lang.startsWith(LANG[lang].bcp.split("-")[0]));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
if(window.speechSynthesis)speechSynthesis.getVoices();

/* ---------- SIMULTANEOUS (Whisper auto-language) ---------- */
let simulOn=false,simulStream=null,simulRecorder=null,simulLoopActive=false;
let audioCtx=null,analyser=null,levelData=null;

simulBtn.onclick=async()=>{
  if(simulOn){stopSimul();return;}
  clearErr();
  if(!keyCheck())return;
  if(listening){listeningStoppedManually=true;try{rec&&rec.stop();}catch(e){}stopUI();}
  if(convoMode){convoMode=false;convoBtn.textContent="🗣 Conversation: OFF";convoBtn.classList.remove("on");}
  try{simulStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){showErr("Mic permission denied.");return;}
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const sn=audioCtx.createMediaStreamSource(simulStream);
  analyser=audioCtx.createAnalyser();analyser.fftSize=512;
  levelData=new Uint8Array(analyser.frequencyBinCount);
  sn.connect(analyser);
  simulOn=true;simulLoopActive=true;
  simulBtn.textContent="⚡ Simultaneous: ON";simulBtn.classList.add("on");
  setStatus("Simultaneous — listening to both languages…",true);
  histBox.style.display="";
  simulLoop();
};
function stopSimul(){
  simulOn=false;simulLoopActive=false;
  try{simulRecorder&&simulRecorder.state!=="inactive"&&simulRecorder.stop();}catch(e){}
  if(simulStream){simulStream.getTracks().forEach(t=>t.stop());simulStream=null;}
  if(audioCtx){audioCtx.close();audioCtx=null;}
  simulBtn.textContent="⚡ Simultaneous: OFF";simulBtn.classList.remove("on");
  setStatus("Ready");
}
function micLevel(){
  analyser.getByteFrequencyData(levelData);
  let s=0;for(let i=0;i<levelData.length;i++)s+=levelData[i];
  return s/levelData.length;
}
async function simulLoop(){
  while(simulLoopActive){
    const blob=await recordSegment(4000);
    if(!simulLoopActive)break;
    if(blob&&blob.size>4000)processSegment(blob);
  }
}
function recordSegment(ms){
  return new Promise(res=>{
    let peak=0;
    const mime=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"";
    simulRecorder=new MediaRecorder(simulStream,mime?{mimeType:mime}:{});
    const chunks=[];
    simulRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    simulRecorder.onstop=()=>res(peak>18?new Blob(chunks,{type:mime||"audio/webm"}):null);
    simulRecorder.start();
    const iv=setInterval(()=>{const l=micLevel();if(l>peak)peak=l;},120);
    setTimeout(()=>{clearInterval(iv);try{simulRecorder.stop();}catch(e){res(null);}},ms);
  });
}
let lastSegText="",lastSegAt=0;
function isDupSegment(text){
  const now=Date.now();
  const a=lastSegText.replace(/[\s。、,.!?！？]/g,"").toLowerCase();
  const b=text.replace(/[\s。、,.!?！？]/g,"").toLowerCase();
  const dup = b && (a.includes(b) || (now-lastSegAt<12000 && b.length>3 && a.endsWith(b.slice(0,Math.min(b.length,a.length)))));
  lastSegText=text;lastSegAt=now;
  return dup;
}
async function processSegment(blob){
  try{
    const fd=new FormData();
    fd.append("file",blob,"seg.webm");
    fd.append("model","gpt-4o-mini-transcribe");
    fd.append("prompt","Conversation mixing Japanese, English and Hebrew. The Japanese speaker may have a foreign accent. Write Japanese in Japanese script, e.g. 元気ですか、ありがとう、こんにちは.");
    const wr=await fetch("https://api.openai.com/v1/audio/transcriptions",{
      method:"POST",headers:{"Authorization":"Bearer "+$("oaiKey").value.trim()},body:fd});
    if(!wr.ok){const t=await wr.text().catch(()=>"");showErr("Transcribe API "+wr.status+(t?" — "+t.slice(0,120):""));return;}
    const w=await wr.json();
    const text=(w.text||"").trim();
    if(!text||text.length<2)return;
    if(isDupSegment(text))return; // tail of the previous utterance caught by the next segment
    // detect language from the script of the text itself — more reliable than the model's guess
    let segSrc = /[\u3040-\u30ff\u4e00-\u9fff]/.test(text) ? "ja"
               : /[\u0590-\u05ff]/.test(text) ? "he" : "en";
    const segDst=segSrc==="en"?"ja":"en";
    let raw;
    try{
      raw=await aiChat(
"A person just said this in "+LANG[segSrc].name+' during a live conversation: "'+text.replace(/"/g,"'")+'"\n'+
"Task: translate it into "+LANG[segDst].name+".\n"+
'Respond ONLY with valid JSON, no fences, exactly: {"t":"the translation written in '+LANG[segDst].name+'","r":"romaji (Latin letters ONLY, e.g. konnichiwa) of the Japanese side"}\n'+
'Rules: "t" MUST be in '+LANG[segDst].name+'. If '+LANG[segDst].name+' is English, "t" must contain no Japanese characters and no romaji — English words only. "r" must contain ONLY Latin letters (Hepburn romaji), never kana or kanji.',500);
    }catch(e){showErr("Translation error — "+(e.message||""));return;}
    raw=raw.replace(/```json|```/g,"").trim();
    let obj;try{obj=JSON.parse(raw);}catch(e){obj={t:raw,r:""};}
    // safety: if target is English but "t" contains Japanese characters, retry once plainly
    if(segDst==="en"&&/[\u3040-\u30ff\u4e00-\u9fff]/.test(obj.t||"")){
      try{obj.t=await aiChat('Translate to natural English, reply with the English translation only: '+text,300);}catch(e){}
    }
    // safety: if "r" is not actually romaji, fetch it properly
    const jaSide = segSrc==="ja" ? text : (segDst==="ja" ? obj.t : "");
    if(jaSide && (!obj.r || /[\u3040-\u30ff\u4e00-\u9fff]/.test(obj.r))){
      try{obj.r=await aiChat('Romanize this Japanese into Hepburn romaji. Reply with the romaji only, Latin letters: '+jaSide,200);}catch(e){obj.r="";}
    }
    // safety: if "r" contains kana/kanji instead of romaji, convert it properly
    if(/[\u3040-\u30ff\u4e00-\u9fff]/.test(obj.r||"")){
      const jaSide = segSrc==="ja" ? text : (obj.t||"");
      try{obj.r=await aiChat('Convert this Japanese to Hepburn romaji. Reply with Latin letters only, nothing else: '+jaSide,200);}catch(e){obj.r="";}
      if(/[\u3040-\u30ff\u4e00-\u9fff]/.test(obj.r||""))obj.r="";
    }
    pushTurn(segSrc==="en"?"a":"b",text,obj.t||"",obj.r||"");
    if(segSrc==="ja") simulSuggest(text);
  }catch(e){showErr("Simultaneous error: "+(e.message||"unknown"));}
}

let suggestBusy=false;
async function simulSuggest(jaText){
  if(suggestBusy)return;suggestBusy=true;
  try{
    let raw=await aiChat(
'Someone just said this in Japanese: "'+jaText.replace(/"/g,"'")+'"\n'+
'Suggest 3 short natural Japanese replies. Respond ONLY with valid JSON, no fences:\n'+
'{"replies":[{"ja":"Japanese reply","romaji":"Hepburn romaji, Latin letters only","meaning":"meaning in English"},{"ja":"...","romaji":"...","meaning":"..."},{"ja":"...","romaji":"...","meaning":"..."}]}',700);
    raw=raw.replace(/```json|```/g,"").trim();
    const obj=JSON.parse(raw);
    if(Array.isArray(obj.replies)&&obj.replies.length){
      repliesBox.style.display="";repliesList.innerHTML="";
      for(const rep of obj.replies){
        const d=document.createElement("div");
        d.className="reply";
        d.innerHTML='<div class="ja">'+escapeHtml(rep.ja||"")+'</div><div class="ro">'+escapeHtml(rep.romaji||"")+'</div><div class="mean">'+escapeHtml(rep.meaning||"")+'</div>';
        d.onclick=()=>speak(rep.ja,"ja");
        repliesList.appendChild(d);
      }
    }
  }catch(e){/* best-effort */}
  suggestBusy=false;
}

/* ---------- CAMERA ---------- */
const camBox=$("camBox"),camVideo=$("camVideo"),camOut=$("camOut"),camRomajiEl=$("camRomaji");
let camStream=null,camTimer=null,camBusy=false,lastCamText="",camScanCount=0;
$("camBtn").onclick=async()=>{
  clearErr();
  if(!keyCheck())return;
  if(listening){listeningStoppedManually=true;try{rec&&rec.stop();}catch(e){}stopUI();}
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});}
  catch(e){showErr("Camera permission denied or unavailable.");return;}
  camVideo.srcObject=camStream;
  camBox.style.display="";
  camOut.textContent="Point the camera at Japanese text…";camOut.classList.add("placeholder");
  camScanCount=0;
  camTimer=setInterval(captureAndTranslate,3000);
};
$("camStop").onclick=()=>{
  clearInterval(camTimer);camTimer=null;
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  camBox.style.display="none";lastCamText="";
};
async function captureAndTranslate(){
  if(camBusy||!camStream)return;
  camBusy=true;camScanCount++;
  if(camOut.classList.contains("placeholder"))camOut.textContent="Scanning… ("+camScanCount+")";
  try{
    const c=document.createElement("canvas");
    const w=camVideo.videoWidth,h=camVideo.videoHeight;
    if(!w){camBusy=false;return;}
    const sc=Math.min(1,1024/Math.max(w,h));
    c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    c.getContext("2d").drawImage(camVideo,0,0,c.width,c.height);
    const b64=c.toDataURL("image/jpeg",0.7).split(",")[1];
    const r=await fetch("https://api.openai.com/v1/chat/completions",{
      method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+$("oaiKey").value.trim()},
      body:JSON.stringify({model:"gpt-4o-mini",max_tokens:600,messages:[{role:"user",content:[
        {type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}},
        {type:"text",text:'Extract any Japanese text visible in this image and translate it to English. Respond ONLY with valid JSON, no markdown fences: {"ja":"the Japanese text found (empty if none)","romaji":"its romaji","en":"English translation"}.'}]}]})
    });
    if(!r.ok){const t=await r.text().catch(()=>"");camOut.classList.remove("placeholder");camOut.textContent="Camera error: API "+r.status+(t?" — "+t.slice(0,120):"");camBusy=false;return;}
    const data=await r.json();
    let raw=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content||"").trim().replace(/```json|```/g,"").trim();
    let obj;try{obj=JSON.parse(raw);}catch(e){camOut.classList.remove("placeholder");camOut.textContent=raw?raw.slice(0,300):"Could not read a response — try again.";camBusy=false;return;}
    if(obj.en&&obj.ja!==lastCamText){
      lastCamText=obj.ja;
      camOut.classList.remove("placeholder");
      camOut.textContent=obj.en;
      camRomajiEl.textContent=obj.ja+(obj.romaji?"  ·  "+obj.romaji:"");
    }else if(!obj.en&&!lastCamText){camOut.textContent="No Japanese text detected yet… ("+camScanCount+")";}
  }catch(e){camOut.classList.remove("placeholder");camOut.textContent="Camera error: "+(e.message||"unknown");}
  camBusy=false;
}

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
